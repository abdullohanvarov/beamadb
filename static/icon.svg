<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="androidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DDC84" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="wifiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Badge -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="6" />

  <!-- Outer Pulse Glow Ring -->
  <circle cx="256" cy="180" r="140" fill="none" stroke="#38BDF8" stroke-width="4" stroke-dasharray="12 12" opacity="0.3" />

  <!-- Wi-Fi Broadcast Arcs (Top) -->
  <path d="M 120 160 A 160 160 0 0 1 392 160" fill="none" stroke="url(#wifiGrad)" stroke-width="20" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 160 200 A 110 110 0 0 1 352 200" fill="none" stroke="url(#wifiGrad)" stroke-width="18" stroke-linecap="round" />
  <path d="M 200 240 A 65 65 0 0 1 312 240" fill="none" stroke="url(#wifiGrad)" stroke-width="16" stroke-linecap="round" />
  
  <!-- Wi-Fi Center Node / Signal Point -->
  <circle cx="256" cy="275" r="14" fill="#38BDF8" filter="url(#glow)" />

  <!-- Android Robot Head & Antennas (Bottom/Center) -->
  <g transform="translate(146, 290)">
    <!-- Left Antenna -->
    <line x1="45" y1="20" x2="25" y2="-10" stroke="url(#androidGrad)" stroke-width="12" stroke-linecap="round" />
    <!-- Right Antenna -->
    <line x1="175" y1="20" x2="195" y2="-10" stroke="url(#androidGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- Head Dome -->
    <path d="M 20 85 A 90 90 0 0 1 200 85 Z" fill="url(#androidGrad)" filter="url(#glow)" />

    <!-- Eyes -->
    <circle cx="70" cy="50" r="9" fill="#0F172A" />
    <circle cx="150" cy="50" r="9" fill="#0F172A" />

    <!-- Subtle Connection Port / Badge on Android Head -->
    <rect x="90" y="92" width="40" height="8" rx="4" fill="#38BDF8" />
  </g>

  <!-- Status Indicator Dot -->
  <circle cx="396" cy="116" r="16" fill="#10B981" filter="url(#glow)" />
  <circle cx="396" cy="116" r="8" fill="#FFFFFF" />
</svg>
